name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        # `-D warnings` because a warning nobody has to act on is a warning
        # everybody stops reading. The four that existed when this was turned on
        # were fixed rather than allowed.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      # `vendor/floem` is excluded from our workspace, so `--workspace` never
      # reaches it — including the tests that hold our own fixes there in place
      # (editor-core/tests/edit_robustness.rs pins two ways `Buffer::edit` could
      # abort the process). editor-core has no GUI dependencies, so this is cheap.
      - name: Test the vendored fork
        run: cargo test --manifest-path vendor/floem/editor-core/Cargo.toml

  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install \
            clang pkg-config libssl-dev libwayland-dev libxkbcommon-x11-dev \
            libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev
      - name: Clippy
        # `-D warnings` because a warning nobody has to act on is a warning
        # everybody stops reading. The four that existed when this was turned on
        # were fixed rather than allowed.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      # `vendor/floem` is excluded from our workspace, so `--workspace` never
      # reaches it — including the tests that hold our own fixes there in place
      # (editor-core/tests/edit_robustness.rs pins two ways `Buffer::edit` could
      # abort the process). editor-core has no GUI dependencies, so this is cheap.
      - name: Test the vendored fork
        run: cargo test --manifest-path vendor/floem/editor-core/Cargo.toml

  corpus:
    name: Parser corpus (real Laravel projects)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Clone a handful of real projects so the heuristic parsers (props
      # contract, query diagnostics, relationship + event graphs, Livewire) meet
      # wild PHP/Vue — not just the happy-path unit tests. We only assert "no
      # panic, sane counts".
      - name: Fetch corpus
        run: |
          mkdir -p corpus
          git clone --depth 1 https://github.com/laravel/laravel.git           corpus/laravel
          git clone --depth 1 https://github.com/inertiajs/pingcrm.git          corpus/pingcrm
          git clone --depth 1 https://github.com/livewire/livewire.git          corpus/livewire
          git clone --depth 1 https://github.com/spatie/laravel-permission.git  corpus/laravel-permission
      - name: Run parsers over the corpus
        env:
          E_CORPUS_DIR: ${{ github.workspace }}/corpus
        run: cargo test -p e-app corpus -- --ignored --nocapture
