name: Release

on:
  push:
    tags: ["v*"]
  # An escape hatch for when one archive fails and the rest are fine: rebuild
  # and attach them to a release that already exists. The DMG isn't built
  # here: scripts/release.sh builds, signs and notarizes it on a Mac.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v0.9.13)"
        required: true
      ref:
        description: "Commit or branch to build from. Defaults to the tag itself; point it elsewhere when the fix you need isn't in the tag."
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build & upload (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin e --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf e-${{ matrix.target }}.tar.gz e
          shasum -a 256 e-${{ matrix.target }}.tar.gz > e-${{ matrix.target }}.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            target/${{ matrix.target }}/release/e-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/e-${{ matrix.target }}.tar.gz.sha256

  linux:
    name: Build & upload (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # Floem (winit + wgpu/vello) + rfd + the DB drivers' TLS. Matches Floem's
      # own CI set, plus libssl for the MySQL driver.
      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install \
            clang pkg-config libssl-dev libwayland-dev libxkbcommon-x11-dev \
            libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev

      - name: Build release binary
        run: cargo build --release --bin e --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf e-${{ matrix.target }}.tar.gz e
          sha256sum e-${{ matrix.target }}.tar.gz > e-${{ matrix.target }}.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            target/${{ matrix.target }}/release/e-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/e-${{ matrix.target }}.tar.gz.sha256

  # Sign every archive the release carries, once the builds have attached
  # them. The in-app updater refuses an archive without a valid signature
  # from the key in e-app/src/updater.rs, so a missing secret fails the
  # release here rather than leaving it uninstallable for everyone.
  sign:
    name: Sign the archives
    needs: [build, linux]
    # Sign what was built even if one target failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Sign and attach
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.E_UPDATE_SIGNING_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The E_UPDATE_SIGNING_KEY secret is not set: the archives stay unsigned and the updater won't install them."
            exit 1
          fi
          mkdir signing && cd signing
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'e-*.tar.gz'
          umask 077
          printf '%s\n' "$SIGNING_KEY" > key.pem
          for archive in e-*.tar.gz; do
            openssl pkeyutl -sign -inkey key.pem -rawin -in "$archive" -out "$archive.sig"
          done
          rm -f key.pem
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber e-*.tar.gz.sig
          ls -l e-*.tar.gz.sig
