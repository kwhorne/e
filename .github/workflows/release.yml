name: Release

on:
  push:
    tags: ["v*"]
  # An escape hatch for when one archive fails and the rest are fine: rebuild
  # and attach them to a release that already exists. The DMG isn't built
  # here: scripts/release.sh builds, signs and notarizes it on a Mac.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v0.9.13)"
        required: true
      ref:
        description: "Commit or branch to build from. Defaults to the tag itself; point it elsewhere when the fix you need isn't in the tag."
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build & upload (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin e --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf e-${{ matrix.target }}.tar.gz e
          shasum -a 256 e-${{ matrix.target }}.tar.gz > e-${{ matrix.target }}.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            target/${{ matrix.target }}/release/e-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/e-${{ matrix.target }}.tar.gz.sha256

  linux:
    name: Build & upload (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # Floem (winit + wgpu/vello) + rfd + the DB drivers' TLS. Matches Floem's
      # own CI set, plus libssl for the MySQL driver.
      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install \
            clang pkg-config libssl-dev libwayland-dev libxkbcommon-x11-dev \
            libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev

      - name: Build release binary
        run: cargo build --release --bin e --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf e-${{ matrix.target }}.tar.gz e
          sha256sum e-${{ matrix.target }}.tar.gz > e-${{ matrix.target }}.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            target/${{ matrix.target }}/release/e-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/e-${{ matrix.target }}.tar.gz.sha256
