[package]
name         = "e-app"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "e_app"
path = "src/lib.rs"

[[bin]]
name = "e"
path = "src/bin/e.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSObject"] }
objc2-app-kit    = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[dependencies]
e-agent            = { workspace = true }
e-core             = { workspace = true }
e-db               = { workspace = true }
e-verify           = { workspace = true }
e-review           = { workspace = true }
e-dap              = { workspace = true }
e-lsp              = { workspace = true }
e-term             = { workspace = true }
floem              = { workspace = true }
floem-editor-core  = { workspace = true }
anyhow             = { workspace = true }
lsp-types          = { workspace = true }
crossbeam-channel  = { workspace = true }
serde_json         = { workspace = true }
ureq               = { version = "2", features = ["json"] }
self_update        = { workspace = true }
sha2               = "0.10"
regex              = { workspace = true }
ignore = "0.4.30"
