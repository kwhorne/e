[package]
name         = "e-db"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
# Everything in `mysql`'s default feature set except `derive`, which pulls in
# mysql-common-derive and through it proc-macro-error2 — a crate that re-exports
# the private `proc_macro` crate and so triggers a future-incompatibility warning
# (rust-lang/rust#127909) on every build. e-db never derives `FromRow`; it reads
# `mysql::Row` positionally, so the macro was compiled for nothing.
# `minimal` is mysql's own name for `flate2/zlib`, which `default` also enables.
mysql = { version = "25", default-features = false, features = [
    "minimal",
    "native-tls",
    "bigdecimal",
    "rust_decimal",
    "time",
    "frunk",
    "binlog",
    "buffer-pool",
] }
postgres   = "0.19"
rusqlite   = { version = "0.32", features = ["bundled"] }
ureq       = "2"

# Connection secrets live in the OS credential store, not in our JSON. The
# backend is picked per platform so neither one drags the other's system
# libraries in: macOS uses the Security framework (no extra packages), Linux
# talks to the Secret Service over D-Bus (needs `libdbus-1-dev` to build — see
# docs/installation.md). Anywhere else there is no backend and e-db falls back
# to a 0600 file.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = [
    "sync-secret-service",
    "crypto-rust",
] }
